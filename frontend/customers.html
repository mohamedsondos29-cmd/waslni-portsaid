<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وصلني | العملاء</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--teal:#168c8c;--navy:#102a43;--bg:#f4f8fa;--muted:#71808b;--border:#dce7ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo,Arial;color:var(--navy)}.top{background:linear-gradient(135deg,#102a43,#168c8c);color:#fff;padding:28px 0}.wrap{width:min(1180px,92%);margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:15px;background:#ffffff20;display:grid;place-items:center;font-size:25px}.back{color:#fff;text-decoration:none;background:#ffffff20;padding:10px 15px;border-radius:12px}.hero{padding:30px 0}.hero h1{margin:0 0 6px;font-size:34px}.hero p{margin:0;color:#dcecef}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select{padding:12px;border:1px solid var(--border);border-radius:12px;background:#fff;font-family:inherit;outline:0}.toolbar input{flex:1;min-width:220px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 7px 25px #102a4310}.stat strong{display:block;color:var(--teal);font-size:26px}.stat span{font-size:11px;color:var(--muted)}.customers{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:18px}.customer{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:10px;padding:5px 9px;border-radius:20px;background:#e8f6f6;color:var(--teal)}.access{background:#f0eafd;color:#6742a6}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.info div{background:#f8fbfc;padding:9px;border-radius:10px;font-size:11px}.info span{display:block;color:var(--muted);font-size:9px;margin-bottom:2px}.empty{text-align:center;color:var(--muted);padding:35px}.note{margin-top:20px;background:#fff8e7;border:1px solid #efd889;border-radius:14px;padding:12px;font-size:10px;color:#705815}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.customers{grid-template-columns:1fr}.hero h1{font-size:27px}}@media(max-width:480px){.info{grid-template-columns:1fr}.topbar{align-items:flex-start}}</style></head><body><header class="top"><div class="wrap topbar"><div class="brand"><div class="logo">👥</div><div><strong>وصلني بورسعيد</strong><div style="font-size:11px;color:#d6eeee">Customer Management</div></div></div><a class="back" href="/">← الرئيسية</a></div><div class="wrap hero"><h1>👥 العملاء</h1><p>بيانات تجريبية منفصلة للعملاء العاديين وعملاء Accessibility.</p></div></header><main class="wrap"><div class="toolbar"><input id="search" placeholder="ابحث بالاسم أو الهاتف أو رقم البطاقة"><select id="type"><option value="all">كل العملاء</option><option value="normal">عملاء عاديين</option><option value="access">Accessibility</option></select></div><section class="stats"><div class="stat"><strong id="total">0</strong><span>إجمالي العملاء</span></div><div class="stat"><strong id="normal">0</strong><span>عملاء عاديين</span></div><div class="stat"><strong id="accessCount">0</strong><span>Accessibility</span></div><div class="stat"><strong id="cards">0</strong><span>بطاقات نشطة</span></div></section><section id="list" class="customers"></section><div class="note">⚠️ كل الأسماء والأرقام والبيانات هنا وهمية Demo Data للعرض والتجربة فقط، وليست بيانات عملاء حقيقيين.</div></main><script>const customers=[{name:'أحمد محمد',phone:'01012345678',card:'W-5399-2048',type:'normal',balance:75,trips:18,route:'خط 2',status:'Active'},{name:'سارة علي',phone:'01087654321',card:'W-5401-7782',type:'access',balance:120,trips:24,route:'خط 7',status:'Active',need:'Wheelchair • Ramp • Lift'},{name:'محمد حسن',phone:'01123456789',card:'W-5403-1120',type:'normal',balance:42,trips:11,route:'خط 3',status:'Active'},{name:'نور أحمد',phone:'01234567890',card:'W-5408-3341',type:'access',balance:95,trips:16,route:'خط 5',status:'Active',need:'Visual Assistance • Audio'},{name:'مريم محمود',phone:'01055554444',card:'W-5410-9217',type:'normal',balance:60,trips:9,route:'خط 1',status:'Active'},{name:'يوسف إبراهيم',phone:'01166778899',card:'W-5412-4408',type:'access',balance:88,trips:21,route:'خط 7',status:'Active',need:'Mobility Assistance • Priority Seat'},{name:'ملك خالد',phone:'01299887766',card:'W-5415-6730',type:'normal',balance:35,trips:7,route:'خط 4',status:'Active'},{name:'عمر سامي',phone:'01022223333',card:'W-5418-5102',type:'access',balance:105,trips:13,route:'خط 2',status:'Active',need:'Wheelchair • Ramp • Visual Display'}];function render(){const q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('type').value;const arr=customers.filter(c=>(t==='all'||c.type===t)&&[c.name,c.phone,c.card,c.route].join(' ').toLowerCase().includes(q));document.getElementById('list').innerHTML=arr.length?arr.map(c=>`<article class="customer"><div class="head"><strong>${c.name}</strong><span class="badge ${c.type==='access'?'access':''}">${c.type==='access'?'♿ Accessibility':'👤 Normal'}</span></div><div class="info"><div><span>Phone</span>📱 ${c.phone}</div><div><span>Card</span>💳 ${c.card}</div><div><span>Balance</span>💰 ${c.balance} EGP</div><div><span>Trips</span>🚌 ${c.trips}</div><div><span>Route</span>📍 ${c.route}</div><div><span>Status</span>🟢 ${c.status}</div>${c.need?`<div style="grid-column:1/-1"><span>Accessibility Needs</span>♿ ${c.need}</div>`:''}</div></article>`).join(''):'<div class="card empty">لا توجد نتائج مطابقة.</div>'}document.getElementById('total').textContent=customers.length;document.getElementById('normal').textContent=customers.filter(c=>c.type==='normal').length;document.getElementById('accessCount').textContent=customers.filter(c=>c.type==='access').length;document.getElementById('cards').textContent=customers.length;document.getElementById('search').addEventListener('input',render);document.getElementById('type').addEventListener('change',render);render();</script></body></html>
